<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Weight</title>
  <style>
    /* â”€â”€ Tokens â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #6c8fff;
      --accent-dim:#2a3660;
      --text:      #e8eaf0;
      --muted:     #6b6f82;
      --success:   #4caf82;
      --danger:    #e05c5c;
      --font-mono: 'SF Mono', 'Fira Mono', 'Consolas', monospace;
      --font-ui:   -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius:    12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* â”€â”€ Header â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #last-entry {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }

    /* â”€â”€ Entry card â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .entry-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #weight-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 42px;
      font-weight: 700;
      text-align: center;
      padding: 12px 8px;
      width: 100%;
      -moz-appearance: textfield;
      outline: none;
      transition: border-color 0.15s;
    }
    #weight-input::-webkit-outer-spin-button,
    #weight-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    #weight-input:focus { border-color: var(--accent); }
    #weight-input::placeholder { color: var(--muted); }

    .unit-label {
      font-family: var(--font-mono);
      font-size: 18px;
      color: var(--muted);
      flex-shrink: 0;
      width: 32px;
    }

    #log-btn {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    #log-btn:active { transform: scale(0.98); opacity: 0.85; }
    #log-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* toast */
    #toast {
      font-size: 13px;
      text-align: center;
      height: 18px;
      margin-top: 10px;
      transition: color 0.2s;
    }
    #toast.ok  { color: var(--success); }
    #toast.err { color: var(--danger); }

    /* â”€â”€ Range selector â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .range-bar {
      display: flex;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .range-btn {
      flex: 1;
      padding: 10px 4px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .range-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .range-btn + .range-btn {
      border-left: 1px solid var(--border);
    }

    /* â”€â”€ Chart â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .chart-wrap {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 12px 12px;
      position: relative;
    }
    .chart-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    canvas#chart {
      width: 100% !important;
      display: block;
    }
    #chart-empty {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 32px 0;
      display: none;
    }

    /* â”€â”€ Recent list â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .recent-wrap {
      width: 100%;
    }
    .recent-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .recent-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .recent-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
    }
    .recent-row .r-date { color: var(--muted); }
    .recent-row .r-weight {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--text);
    }
    #recent-empty {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Weight</h1>
    <span id="last-entry">â€”</span>
  </header>

  <!-- Entry -->
  <div class="card">
    <div class="entry-row">
      <input id="weight-input" type="number" inputmode="numeric"
             min="50" max="500" placeholder="183" autocomplete="off" />
      <span class="unit-label">lbs</span>
    </div>
    <button id="log-btn">Log weight</button>
    <div id="toast"></div>
  </div>

  <!-- Range selector -->
  <div class="range-bar">
    <button class="range-btn" data-range="21">3 wks</button>
    <button class="range-btn active" data-range="30">1 mo</button>
    <button class="range-btn" data-range="365">1 yr</button>
    <button class="range-btn" data-range="0">All</button>
  </div>

  <!-- Chart -->
  <div class="chart-wrap">
    <div class="chart-label">trend</div>
    <canvas id="chart" height="180"></canvas>
    <div id="chart-empty">No data for this range yet.</div>
  </div>

  <!-- Recent entries -->
  <div class="recent-wrap">
    <div class="recent-label">Recent</div>
    <div class="recent-list" id="recent-list">
      <div id="recent-empty">No entries yet.</div>
    </div>
  </div>

  <!-- Chart.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <script>
    // â”€â”€ CONFIG â€” paste your Apps Script URL here â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const SCRIPT_URL = https://script.google.com/macros/s/AKfycbyIVWfaFMw6zTUqSRppvDKmOKDWKQH2B3yppE1zW-K6TUVpuMdrJTUJYqbr0LlEhOVF/exec;
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    let allEntries = [];
    let activeRange = 30;
    let chartInstance = null;

    // â”€â”€ Fetch all entries from sheet â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function loadEntries() {
      try {
        const res  = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (data.status === "ok") {
          allEntries = data.entries.sort((a, b) => new Date(a.date) - new Date(b.date));
          renderAll();
        }
      } catch (err) {
        console.error("Load failed:", err);
      }
    }

    // â”€â”€ Log a new weight â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    document.getElementById("log-btn").addEventListener("click", async () => {
      const input  = document.getElementById("weight-input");
      const val    = Number(input.value);
      const btn    = document.getElementById("log-btn");
      const toast  = document.getElementById("toast");

      if (!val || val < 50 || val > 500) {
        showToast("Enter a valid weight (50â€“500).", "err");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Loggingâ€¦";

      const today = new Date().toISOString().split("T")[0];

      // Optimistic update
      allEntries.push({ date: today, weight: val });
      allEntries.sort((a, b) => new Date(a.date) - new Date(b.date));
      renderAll();

      try {
        const res  = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ date: today, weight: val }),
        });
        const data = await res.json();
        if (data.status === "ok") {
          showToast(`Logged ${val} lbs â€” ${formatDate(today)}`, "ok");
          input.value = "";
        } else {
          throw new Error(data.message);
        }
      } catch (err) {
        showToast("Failed to save. Check connection.", "err");
        // Roll back optimistic entry
        allEntries = allEntries.filter(e => !(e.date === today && e.weight === val));
        renderAll();
      } finally {
        btn.disabled = false;
        btn.textContent = "Log weight";
      }
    });

    // Allow Enter key
    document.getElementById("weight-input").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("log-btn").click();
    });

    // â”€â”€ Range buttons â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    document.querySelectorAll(".range-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeRange = Number(btn.dataset.range);
        renderChart();
      });
    });

    // â”€â”€ Render everything â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderAll() {
      renderChart();
      renderRecent();
      renderLastEntry();
    }

    function filteredEntries() {
      if (activeRange === 0) return allEntries;
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - activeRange);
      return allEntries.filter(e => new Date(e.date) >= cutoff);
    }

    // â”€â”€ Chart â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderChart() {
      const entries = filteredEntries();
      const canvas  = document.getElementById("chart");
      const empty   = document.getElementById("chart-empty");

      if (entries.length < 2) {
        canvas.style.display = "none";
        empty.style.display  = "block";
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        return;
      }

      canvas.style.display = "block";
      empty.style.display  = "none";

      const labels = entries.map(e => formatDateShort(e.date));
      const values = entries.map(e => e.weight);
      const minW   = Math.min(...values) - 3;
      const maxW   = Math.max(...values) + 3;

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [{
            data: values,
            borderColor: "#6c8fff",
            backgroundColor: "rgba(108,143,255,0.08)",
            borderWidth: 2,
            pointBackgroundColor: "#6c8fff",
            pointRadius: entries.length > 60 ? 0 : 3,
            pointHoverRadius: 5,
            fill: true,
            tension: 0.3,
          }]
        },
        options: {
          responsive: true,
          animation: { duration: 300 },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: "#1a1d27",
              borderColor: "#2a2d3a",
              borderWidth: 1,
              titleColor: "#6b6f82",
              bodyColor: "#e8eaf0",
              bodyFont: { family: "'SF Mono', monospace", size: 14, weight: "700" },
              callbacks: {
                label: ctx => ` ${ctx.parsed.y} lbs`
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: "#6b6f82",
                font: { size: 10 },
                maxTicksLimit: 6,
                maxRotation: 0,
              },
              grid: { color: "#2a2d3a" }
            },
            y: {
              min: minW,
              max: maxW,
              ticks: {
                color: "#6b6f82",
                font: { family: "'SF Mono', monospace", size: 10 },
                callback: v => v + " lbs",
                maxTicksLimit: 5,
              },
              grid: { color: "#2a2d3a" }
            }
          }
        }
      });
    }

    // â”€â”€ Recent list â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderRecent() {
      const list  = document.getElementById("recent-list");
      const empty = document.getElementById("recent-empty");
      const last7 = [...allEntries].reverse().slice(0, 7);

      if (last7.length === 0) {
        list.innerHTML = "";
        list.appendChild(empty);
        empty.style.display = "block";
        return;
      }

      list.innerHTML = last7.map(e => `
        <div class="recent-row">
          <span class="r-date">${formatDate(e.date)}</span>
          <span class="r-weight">${e.weight} lbs</span>
        </div>
      `).join("");
    }

    // â”€â”€ Last entry in header â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderLastEntry() {
      const el = document.getElementById("last-entry");
      if (allEntries.length === 0) { el.textContent = "â€”"; return; }
      const last = allEntries[allEntries.length - 1];
      el.textContent = `${last.weight} lbs`;
    }

    // â”€â”€ Toast â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showToast(msg, type) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = type;
      setTimeout(() => { t.textContent = ""; t.className = ""; }, 3500);
    }

    // â”€â”€ Date helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function formatDate(iso) {
      const [y, m, d] = iso.split("-");
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${months[+m-1]} ${+d}`;
    }
    function formatDateShort(iso) {
      const [, m, d] = iso.split("-");
      return `${+m}/${+d}`;
    }

    // â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    loadEntries();
  </script>
</body>
</html>
